<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Master Download Manager</title>
<meta name="color-scheme" content="dark light">
<style>
:root{--bg:#0b0d12;--ink:#e8ecf5;--ink-2:#a8b2c6;--brand:#6366f1;--brand-2:#22c55e}
@media (prefers-color-scheme:light){:root{--bg:#fff;--ink:#0f1320;--ink-2:#485066;--brand:#4f46e5;--brand-2:#15803d}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:120px 22px}
.eyebrow{color:var(--brand-2);font-weight:600;font-size:14px;letter-spacing:.02em;margin:0 0 14px}
h1{font-size:clamp(34px,6vw,56px);line-height:1.06;letter-spacing:-.03em;margin:0 0 18px}
h1 em{font-style:normal;color:var(--brand)}
p{color:var(--ink-2);margin:0 0 26px}
a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;
  border-radius:999px;padding:12px 22px}
a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">404</p>
  <h1>That page isn't <em>here</em>.</h1>
  <p>The address you followed doesn't exist on this site.</p>
  <a href="./">Back to the start</a>
</div>
</body>
</html>
